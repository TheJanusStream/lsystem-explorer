[package]
name = "lsystem-explorer"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", features = ["file_watcher"] }
bevy_egui = "0.39"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
symbios = { path = "../symbios" }
symbios-turtle-3d = { path = "../symbios-turtle-3d" }
symbios-genetics = { path = "../symbios-genetics" }
bevy_symbios = { path = "../bevy_symbios", features = ["egui", "asset-loader"] }
bevy_symbios_texture = { path = "../bevy_symbios_texture" }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
rand_pcg = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.82", features = [
    "Document",
    "Window",
    "HtmlElement",
    "HtmlAnchorElement",
    "Blob",
    "Url",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardEvent",
    "Navigator",
] }
wasm-bindgen = "0.2.114"
js-sys = "0.3.82"
